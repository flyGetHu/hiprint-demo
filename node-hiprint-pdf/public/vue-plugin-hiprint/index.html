<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 本地 CSS -->
    <link rel="stylesheet" type="text/css" href="vendor/css/print-lock.css" />
    <link rel="stylesheet" type="text/css" media="print" href="vendor/css/print-lock.css" />
    <!-- 本地 JS -->
    <script src="vendor/js/jquery.js"></script>
    <script src="vendor/js/JsBarcode.all.min.js"></script>
    <script src="vendor/js/jquery.minicolors.min.js"></script>
    <script src="vendor/js/socket.io.min.js"></script>
    <script src="vendor/js/canvg.min.js"></script>
    <script src="vendor/js/jspdf.umd.min.js"></script>
    <script src="vendor/js/html2canvas.js"></script>
    <script src="vendor/js/nzh.min.js"></script>
    <script src="vendor/js/bwip-js.js"></script>
    <script src="vendor/js/vue-plugin-hiprint.js"></script>
    <script src="vendor/js/axios.min.js"></script>
  </head>

  <body>
    <div id="hiprintTemplate" class="hiprintTemplate"></div>
  </body>
  <script defer>
    window.autoConnect = false;
    const templateDiv = document.querySelector("#hiprintTemplate.hiprintTemplate");

    // 初始化 hiprint
    hiprint.init({});

    /**
     * 使用注入的数据直接渲染（跳过 HTTP 请求）
     */
    window.renderWithData = function(data) {
      try {
        if (!data || !data.template) {
          templateDiv.appendChild($(`<div class="hiprint-printTemplate">数据无效: 缺少 template</div>`)[0]);
          return;
        }
        var hiprintTemplate = new hiprint.PrintTemplate({
          template: data.template,
        });
        let htmlJq = hiprintTemplate.getHtml(data.printData || {});
        templateDiv.innerHTML = ''; // 清空之前的内容
        templateDiv.appendChild(htmlJq[0]);
      } catch (error) {
        console.error("renderWithData error:", error);
        templateDiv.appendChild($(`<div class="hiprint-printTemplate">渲染失败: ${error.message}</div>`)[0]);
      }
    };

    /**
     * 兼容旧模式：通过 URL 参数 + HTTP 请求获取数据
     */
    function renderFromUrl() {
      const search = window.location.search;
      const id = search.split("=")[1];
      console.log(id);
      if (!id) return;
      axios
        .get("/template", {
          params: {
            id: id,
          },
        })
        .then((res) => {
          if (res.status == 200 && res.data.code == 200) {
            var data = res.data.data;
            var hiprintTemplate = new hiprint.PrintTemplate({
              template: data.template,
            });
            let htmlJq = hiprintTemplate.getHtml(data.printData);
            templateDiv.appendChild(htmlJq[0]);
          } else {
            templateDiv.appendChild($(`<div class="hiprint-printTemplate">获取模板失败:${JSON.stringify(res.data)}</div>`)[0]);
          }
        })
        .catch((error) => {
          console.log(error);
          templateDiv.appendChild($(`<div class="hiprint-printTemplate">${error}</div>`)[0]);
        });
    }

    // 如果 URL 有 id 参数，使用旧模式
    if (window.location.search.includes("id=")) {
      renderFromUrl();
    }
  </script>
</html>
